<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="GoGraphCtx terminal demo showing 533ms indexing and 2.7ms MCP get_impact JSON output">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 13px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #94a3b8; font-weight: 600; }
      .prompt { fill: #38bdf8; font-weight: 700; }
      .cmd { fill: #f8fafc; font-weight: 600; }
      .ok { fill: #4ade80; }
      .muted { fill: #94a3b8; }
      .key { fill: #7dd3fc; }
      .str { fill: #a7f3d0; }
      .num { fill: #fbbf24; }
      .badge { fill: #22d3ee; font-weight: 700; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s infinite; fill: #38bdf8; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="470" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="0" y="0" width="920" height="38" rx="14" fill="#161f33"/>
  <rect x="0" y="24" width="920" height="14" fill="#161f33"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="19" r="6" fill="#22c55e"/>
  <text x="460" y="23" text-anchor="middle" class="title">GoGraphCtx v1 — Single-Binary Code Graph MCP Server (15.8 MB, Zero DB)</text>

  <text x="24" y="68" class="mono"><tspan class="prompt">$ </tspan><tspan class="cmd">gographctx index ./flask-app</tspan></text>
  <text x="24" y="90" class="mono ok">✓ Discovered 83 Python files -> Parsed (AST) -> Resolved (8-tier) -> Compacted .ggctx/index.ggctx</text>
  <text x="24" y="110" class="mono muted">  Indexed <tspan class="num">83</tspan> files | <tspan class="num">705</tspan> nodes | <tspan class="num">2,208</tspan> edges | <tspan class="badge">100.0% strong-tier</tspan> in <tspan class="num">533ms</tspan> (Peak RSS <tspan class="num">51.0 MB</tspan>)</text>

  <text x="24" y="146" class="mono"><tspan class="prompt">$ </tspan><tspan class="cmd">gographctx query --format json get_impact app.core::validate</tspan></text>
  <text x="24" y="172" class="mono muted">{</text>
  <text x="40" y="192" class="mono"><tspan class="key">"tool"</tspan><tspan class="muted">: </tspan><tspan class="str">"get_impact"</tspan><tspan class="muted">, </tspan><tspan class="key">"truncated"</tspan><tspan class="muted">: </tspan><tspan class="num">false</tspan><tspan class="muted">, </tspan><tspan class="key">"returned"</tspan><tspan class="muted">: </tspan><tspan class="num">2</tspan><tspan class="muted">,</tspan></text>
  <text x="40" y="212" class="mono"><tspan class="key">"confidence_summary"</tspan><tspan class="muted">: { </tspan><tspan class="key">"certain"</tspan><tspan class="muted">: </tspan><tspan class="num">2</tspan><tspan class="muted">, </tspan><tspan class="key">"likely"</tspan><tspan class="muted">: </tspan><tspan class="num">0</tspan><tspan class="muted">, </tspan><tspan class="key">"unresolved"</tspan><tspan class="muted">: </tspan><tspan class="num">0</tspan><tspan class="muted">, </tspan><tspan class="key">"overall_label"</tspan><tspan class="muted">: </tspan><tspan class="str">"certain"</tspan><tspan class="muted"> },</tspan></text>
  <text x="40" y="232" class="mono"><tspan class="key">"metadata"</tspan><tspan class="muted">: { </tspan><tspan class="key">"estimated_tokens"</tspan><tspan class="muted">: </tspan><tspan class="num">382</tspan><tspan class="muted">, </tspan><tspan class="key">"token_budget"</tspan><tspan class="muted">: </tspan><tspan class="num">4000</tspan><tspan class="muted">, </tspan><tspan class="key">"resolution_coverage"</tspan><tspan class="muted">: </tspan><tspan class="num">1.0</tspan><tspan class="muted"> },</tspan></text>
  <text x="40" y="252" class="mono"><tspan class="key">"impacted"</tspan><tspan class="muted">: [</tspan></text>
  <text x="56" y="272" class="mono muted">{ <tspan class="key">"qualified_name"</tspan>: <tspan class="str">"app.service::normalize"</tspan>, <tspan class="key">"depth"</tspan>: <tspan class="num">1</tspan>, <tspan class="key">"effective_tier"</tspan>: <tspan class="str">"qualified import"</tspan>, <tspan class="key">"certain"</tspan>: <tspan class="num">true</tspan> },</text>
  <text x="56" y="292" class="mono muted">{ <tspan class="key">"qualified_name"</tspan>: <tspan class="str">"app.routes::endpoint"</tspan>,  <tspan class="key">"depth"</tspan>: <tspan class="num">2</tspan>, <tspan class="key">"effective_tier"</tspan>: <tspan class="str">"qualified import"</tspan>, <tspan class="key">"certain"</tspan>: <tspan class="num">true</tspan> }</text>
  <text x="40" y="312" class="mono muted">]</text>
  <text x="24" y="332" class="mono muted">}</text>

  <line x1="24" y1="354" x2="896" y2="354" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="382" class="mono"><tspan class="prompt">$ </tspan><tspan class="cmd">gographctx watch ./flask-app</tspan><tspan class="muted">   # live fsnotify + MCP stdio for Claude Code / Cursor</tspan></text>
  <text x="24" y="406" class="mono ok">Updated app/helpers.py in 22.8ms (re-resolved 1 dependents)</text>
  <text x="24" y="438" class="mono"><tspan class="prompt">$ </tspan><tspan class="muted">MCP query p95: 3.80 ms  |  Go 1,000 files: 1.40 s, 116.9 MB RSS  |  Zero Docker / Zero Neo4j</tspan></text>
  <rect x="820" y="426" width="8" height="15" class="cursor"/>
</svg>
