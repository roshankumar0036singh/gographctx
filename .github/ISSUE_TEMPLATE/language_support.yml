name: Language Support Request
description: Request parser or resolver improvements for a programming language
title: "[Language]: "
labels: ["language-support"]
body:
  - type: input
    id: language
    attributes:
      label: Language / framework syntax
      placeholder: "e.g. C#, Ruby, PHP, Kotlin, or Python async decorators"
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal code sample & expected call/inheritance edges
      description: Paste a short self-contained snippet and the edges GoGraphCtx should resolve.
    validations:
      required: true
