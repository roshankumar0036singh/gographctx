name: Feature Request
description: Propose a new MCP capability, CLI flag, or optimization
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement / LLM workflow friction
      description: What codebase navigation or agent workflow problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
