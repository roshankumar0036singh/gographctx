name: Cross-Platform Binary Smoke

on:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Build & CLI Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build stripped static binary and verify <30MB target
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          BIN="gographctx"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            BIN="gographctx.exe"
          fi
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::8}" -o "${BIN}" ./cmd/gographctx
          SIZE_BYTES=$(wc -c < "${BIN}" | tr -d ' ')
          SIZE_MB=$((SIZE_BYTES / 1048576))
          echo "Binary size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"
          if [ "${SIZE_BYTES}" -gt 31457280 ]; then
            echo "Binary exceeded 30MB target"
            exit 1
          fi

      - name: Execute CLI smoke suite (version, index, stats, query, serve)
        shell: bash
        run: |
          BIN="./gographctx"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            BIN="./gographctx.exe"
          fi
          TMP_REPO="$(mktemp -d)"
          cat <<'EOF' > "${TMP_REPO}/app.py"
          def greet(name: str) -> str:
              return f"hi {name}"

          def run() -> str:
              return greet("world")
          EOF

          "${BIN}" version
          "${BIN}" index --force "${TMP_REPO}"
          "${BIN}" stats --format json "${TMP_REPO}"
          "${BIN}" query --format json find_symbol greet "${TMP_REPO}"
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' | "${BIN}" serve "${TMP_REPO}"
          rm -rf "${TMP_REPO}"
