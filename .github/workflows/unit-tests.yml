name: Unit Tests

on:
  pull_request:
    branches: [main, "phase-*"]
  push:
    branches: [main, "phase-*"]

concurrency:
  group: unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run fast unit tests with race detector and coverage
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Summarize per-package coverage
        if: always() && matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        shell: bash
        run: |
          if [ -f coverage.out ]; then
            echo "### Unit Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            go tool cover -func=coverage.out | tail -n 25 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage profile
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-linux-go${{ matrix.go-version }}
          path: coverage.out
          retention-days: 14
